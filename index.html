<!DOCTYPE html>
<html>
<head>
  <!--
    Base path setup for Flutter web.
  -->
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutter_portfolio</title>

  <!-- ❌ Removed manifest.json to stop install prompt -->
  <!-- <link rel="manifest" href="manifest.json"> -->
   <meta name="monetag" content="d2add46247736e3d3f81037e7af56e1a">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "180325833";
  </script>

  <!-- Flutter initialization JS -->
  <script src="flutter.js" defer></script>
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.12.313/build/pdf.js" type="text/javascript"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@2.12.313/build/pdf.worker.min.js";
    pdfRenderOptions = {
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.12.313/cmaps/',
      cMapPacked: true,
    }
  </script>
  <script>
    window.addEventListener('load', function(ev) {
      // ✅ Disabled service worker registration to avoid PWA install popup
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
